<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie Clicker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    repeating-linear-gradient(
        45deg,
        #8d5a36,
        #8d5a36 20px,
        #7a4e2f 20px,
        #7a4e2f 40px
    );

    color:white;
}

.game{
    width:900px;
    max-width:95%;
    padding:25px;
    border-radius:25px;

    background:rgba(40,20,10,.92);

    box-shadow:
        0 0 40px rgba(0,0,0,.5),
        inset 0 0 30px rgba(255,255,255,.05);
}

h1{
    text-align:center;
    margin-bottom:20px;
    font-size:3rem;
}

.layout{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.panel{
    background:rgba(255,255,255,.08);
    border-radius:18px;
    padding:15px;
}

.left{ width:220px; }
.center{ flex:1; min-width:320px; text-align:center; }
.right{ width:220px; }

.stat{
    margin:10px 0;
    font-size:1.1rem;
}

#cookies{
    color:gold;
    font-size:2rem;
    text-shadow:0 0 10px gold, 0 0 20px gold;
}

.cookie-area{
    position:relative;
    width:320px;
    height:320px;
    margin:auto;
}

#cookie{
    width:280px;
    height:280px;
    position:absolute;
    left:20px;
    top:20px;
    cursor:pointer;
    border-radius:50%;

    background:
        radial-gradient(circle at 30% 30%,
            #f5c37a 0%,
            #e4a85c 35%,
            #c9863d 75%,
            #9c5d24 100%);

    box-shadow:
        inset 12px 12px rgba(255,255,255,.25),
        inset -15px -15px rgba(0,0,0,.15),
        0 12px 25px rgba(0,0,0,.35);
}

#cookie:active{
    transform:scale(.95);
}

.chip{
    width:20px;
    height:20px;
    border-radius:50%;
    background:radial-gradient(circle,#6d3f20,#3b1f10);
    position:absolute;
}

.cursor{
    position:absolute;
    width:0;
    height:0;

    border-top:22px solid white;
    border-right:14px solid transparent;

    transform:rotate(-20deg);
    filter:drop-shadow(2px 2px 2px rgba(0,0,0,.4));

    animation:float 1.8s infinite;
}

.cursor::after{
    content:"";
    position:absolute;
    left:-3px;
    top:-20px;

    width:3px;
    height:24px;
    background:white;

    transform:rotate(-45deg);
}

@keyframes float{
    0%,100%{ transform:rotate(-20deg) translateY(0); }
    50%{ transform:rotate(-30deg) translateY(-6px); }
}

button{
    width:100%;
    margin-top:10px;
    padding:12px;

    border:none;
    border-radius:12px;

    cursor:pointer;
    font-weight:bold;

    background:linear-gradient(to bottom,#ffe08a,#dba642);
}

button:hover{
    transform:translateY(-2px);
}

.plus{
    position:absolute;
    font-size:26px;
    font-weight:bold;
    color:white;
    animation:rise .8s forwards;
}

@keyframes rise{
    from{ opacity:1; transform:translateY(0); }
    to{ opacity:0; transform:translateY(-60px); }
}

#floating{
    position:absolute;
    width:100%;
    height:100%;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="game">

    <h1>Cookie Clicker</h1>

    <div class="layout">

        <div class="panel left">
            <h2>Stats</h2>

            <div class="stat">
                Cookies:
                <div id="cookies">0</div>
            </div>

            <div class="stat">
                Per Click:
                <span id="cpc">1</span>
            </div>

            <div class="stat">
                Auto Clickers:
                <span id="autoCount">0</span>
            </div>
        </div>

        <div class="panel center">

            <div class="cookie-area">

                <div id="floating"></div>

                <div id="cookie" onclick="clickCookie()">

                    <div class="chip" style="top:40px;left:60px;"></div>
                    <div class="chip" style="top:70px;left:150px;"></div>
                    <div class="chip" style="top:110px;left:90px;"></div>
                    <div class="chip" style="top:150px;left:180px;"></div>
                    <div class="chip" style="top:200px;left:120px;"></div>

                </div>

                <div id="cursorArea"></div>

            </div>

        </div>

        <div class="panel right">
            <h2>Shop</h2>

            <button onclick="buyUpgrade()">
                Upgrade Click<br>
                Cost: <span id="upgradeCost">10</span>
            </button>

            <button onclick="buyAuto()">
                Buy Cursor<br>
                Cost: <span id="autoCost">40</span>
            </button>
        </div>

    </div>

</div>

<script>
let cookies = 0;
let cpc = 1;

let upgradeCost = 10;
let autoClickers = 0;
let autoCost = 40;

function update(){
    document.getElementById("cookies").textContent = Math.floor(cookies);
    document.getElementById("cpc").textContent = cpc;
    document.getElementById("autoCount").textContent = autoClickers;
    document.getElementById("upgradeCost").textContent = upgradeCost;
    document.getElementById("autoCost").textContent = autoCost;
}

function clickCookie(){
    cookies += cpc;

    const pop = document.createElement("div");
    pop.className = "plus";
    pop.textContent = "+" + cpc;
    pop.style.left = "130px";
    pop.style.top = "120px";

    document.getElementById("floating").appendChild(pop);
    setTimeout(()=>pop.remove(),800);

    update();
}

function buyUpgrade(){
    if(cookies >= upgradeCost){
        cookies -= upgradeCost;
        cpc++;

        upgradeCost = Math.floor(upgradeCost * 2.0);

        update();
    }
}

function buyAuto(){
    if(cookies >= autoCost){
        cookies -= autoCost;
        autoClickers++;

        autoCost = Math.floor(autoCost * 2.3);

        const cursor = document.createElement("div");
        cursor.className = "cursor";

        cursor.style.left = Math.random()*250 + "px";
        cursor.style.top = Math.random()*250 + "px";

        document.getElementById("cursorArea").appendChild(cursor);

        update();
    }
}

/* AUTO COOKIES */
setInterval(()=>{
    cookies += autoClickers;
    update();
},1000);

/* CHEAT KEY: T = +1,000,000 */
document.addEventListener("keydown", function(event){
    if(event.key.toLowerCase() === "t"){
        cookies += 1000000;

        const pop = document.createElement("div");
        pop.className = "plus";
        pop.textContent = "+1,000,000 (CHEAT)";
        pop.style.left = "90px";
        pop.style.top = "100px";

        document.getElementById("floating").appendChild(pop);
        setTimeout(()=>pop.remove(),900);

        update();
    }
});

update();
</script>

</body>
</html>
