<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cookie Clicker</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(120deg,#2b1b10,#5a2e12,#2b1b10);
    color:white;
    overflow:hidden;
}

/* animated background */
body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 2px, transparent 3px);
    background-size:50px 50px;
    animation: moveBg 20s linear infinite;
    opacity:0.3;
}

@keyframes moveBg{
    from{transform:translate(0,0);}
    to{transform:translate(-200px,-200px);}
}

.game{
    width:95%;
    max-width:1100px;
    margin:20px auto;
    background:rgba(0,0,0,0.65);
    padding:20px;
    border-radius:20px;
    box-shadow:0 0 40px black;
}

h1{text-align:center;font-size:2.5rem;}

.container{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.panel{
    flex:1;
    background:rgba(255,255,255,0.05);
    padding:15px;
    border-radius:15px;
    min-width:250px;
}

.cookie{
    width:220px;
    height:220px;
    border-radius:50%;
    margin:auto;
    cursor:pointer;
    background: radial-gradient(circle at 30% 30%, #f7d29b, #c07a33);
    box-shadow:inset 10px 10px 20px rgba(255,255,255,0.2),
               inset -10px -10px 20px rgba(0,0,0,0.3);
    transition:transform 0.1s;
}

.cookie:active{transform:scale(0.92);}

.chip{
    position:absolute;
    width:12px;
    height:12px;
    background:#5a2d10;
    border-radius:50%;
}

button{
    width:100%;
    padding:10px;
    margin-top:8px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:linear-gradient(#ffd27a,#c28a2b);
    font-weight:bold;
}

.stat{
    margin:6px 0;
}

.float{
    position:absolute;
    pointer-events:none;
    animation:rise 1s forwards;
}

@keyframes rise{
    from{opacity:1;transform:translateY(0);}
    to{opacity:0;transform:translateY(-60px);}
}
</style>
</head>

<body>

<div class="game">
<h1>Cookie Clicker</h1>

<div class="container">

<div class="panel">
<h2>Stats</h2>
<div class="stat">Cookies: <span id="cookies">0</span></div>
<div class="stat">CPS: <span id="cps">0</span></div>
<div class="stat">Prestige: <span id="prestige">0</span></div>
</div>

<div class="panel" style="text-align:center;position:relative;">
<div id="cookie" class="cookie" onclick="clickCookie()"></div>
</div>

<div class="panel">
<h2>Shop</h2>

<button onclick="buy('grandma')">👵 Grandma (10 CPS) - <span id="gCost">50</span></button>
<button onclick="buy('farm')">🌾 Farm (50 CPS) - <span id="fCost">500</span></button>
<button onclick="buy('factory')">🏭 Factory (200 CPS) - <span id="faCost">5000</span></button>

<button onclick="prestige()">⭐ Prestige Reset</button>

</div>

</div>
</div>

<script>
let cookies = 0;
let prestige = 0;

let cps = 0;

let grandma = 0;
let farm = 0;
let factory = 0;

let gCost = 50;
let fCost = 500;
let faCost = 5000;

function clickCookie(){
    cookies += 1 + prestige;

    showFloat("+1");

    update();
}

function buy(type){
    if(type==="grandma" && cookies>=gCost){
        cookies -= gCost;
        grandma++;
        cps += 10;
        gCost = Math.floor(gCost*1.15);
    }

    if(type==="farm" && cookies>=fCost){
        cookies -= fCost;
        farm++;
        cps += 50;
        fCost = Math.floor(fCost*1.18);
    }

    if(type==="factory" && cookies>=faCost){
        cookies -= faCost;
        factory++;
        cps += 200;
        faCost = Math.floor(faCost*1.2);
    }

    update();
}

function prestige(){
    if(cookies > 10000){
        prestige += Math.floor(cookies/10000);
        cookies = 0;
        cps = 0;
        grandma = farm = factory = 0;
        gCost=50; fCost=500; faCost=5000;
    }
    update();
}

function showFloat(text){
    let el = document.createElement("div");
    el.className="float";
    el.innerText=text;
    el.style.left="50%";
    el.style.top="50%";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1000);
}

function update(){
    document.getElementById("cookies").innerText=Math.floor(cookies);
    document.getElementById("cps").innerText=cps;
    document.getElementById("prestige").innerText=prestige;

    document.getElementById("gCost").innerText=gCost;
    document.getElementById("fCost").innerText=fCost;
    document.getElementById("faCost").innerText=faCost;
}

setInterval(()=>{
    cookies += cps/10;
    update();
},100);

update();

<script>
// ===== SAVE SYSTEM =====
function saveGame(){
    localStorage.setItem("cookieSave", JSON.stringify({
        cookies, cps, prestige,
        grandma, farm, factory,
        gCost, fCost, faCost
    }));
}

function loadGame(){
    let data = JSON.parse(localStorage.getItem("cookieSave"));
    if(!data) return;

    cookies = data.cookies;
    cps = data.cps;
    prestige = data.prestige;

    grandma = data.grandma;
    farm = data.farm;
    factory = data.factory;

    gCost = data.gCost;
    fCost = data.fCost;
    faCost = data.faCost;

    update();
}

setInterval(saveGame, 3000);
loadGame();

// ===== KEYBINDS =====
document.addEventListener("keydown", (e)=>{
    if(e.key==="t"){
        cookies += 1000000;
    }
    if(e.key==="r"){
        localStorage.clear();
        location.reload();
    }
    if(e.key==="p"){
        prestige();
    }
});

// ===== ACHIEVEMENTS =====
let achievements = [];

function checkAchievements(){
    if(cookies>1000 && !achievements.includes("1k")){
        achievements.push("1k");
        alert("Achievement: 1,000 Cookies!");
    }

    if(cookies>1000000 && !achievements.includes("1m")){
        achievements.push("1m");
        alert("Achievement: 1,000,000 Cookies!");
    }

    if(grandma>0 && !achievements.includes("grandma")){
        achievements.push("grandma");
        alert("Achievement: First Grandma!");
    }
}

setInterval(checkAchievements, 2000);

// ===== POLISH AUTO EFFECTS =====
setInterval(()=>{
    document.body.style.filter = `hue-rotate(${Math.random()*10}deg)`;
},5000);

// ===== AUTO CPS =====
setInterval(()=>{
    cookies += cps/10;
    update();
},100);
</script>

</body>
</html>
